# The Logbook — nginx reverse proxy for the Docker Compose `production` profile
#
# Mounted by docker-compose.yml as /etc/nginx/conf.d/default.conf, so the
# nginx:alpine image's own nginx.conf supplies the events and http blocks.
# infrastructure/nginx/nginx.conf is the host-install counterpart (upstreams
# on 127.0.0.1, Let's Encrypt paths, a site include); keep behaviour in step
# between the two. tests/test_nginx_config_consistency.py checks the parts
# that must agree with the backend.
#
# TLS terminates here. Certificates are read from ./infrastructure/nginx/ssl
# (fullchain.pem, privkey.pem) and nginx refuses to start until both exist —
# see "Docker Compose production profile" in docs/DEPLOYMENT.md.

# ── Requests that are never access-logged ───────────────────────────────────
# The anonymous side of the suggestion box: submitting, and following up with a
# key. The service rounds these to noon so a submission cannot be lined up
# against a member's sign-in, and an access-log line holding the client IP and
# the exact second would undo that. Keyed on $request_uri rather than $uri or a
# location because a failed submission is handed to @api_error_50x by
# error_page, and the line is written wherever the request ends up. Keep the
# pattern in step with UNLOGGED_PATH in backend/app/core/logging.py.
map $request_uri $access_loggable {
    "~^/api/v1/suggestions/(boxes/[^/?]+/submissions(\?|$)|follow-up/)" 0;
    default 1;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# The Compose services, resolved on the intranet-network bridge.
upstream backend_api {
    server backend:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream frontend_app {
    server frontend:80;
    keepalive 32;
}

# HTTP — certificate renewal, and a redirect for everything else
server {
    listen 80;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log main if=$access_loggable;

    # certbot --webroot writes challenge files into ./infrastructure/nginx/certbot
    # on the host; this serves them for renewal while the stack is running.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Barcode and member-ID scanners need the first-party camera. Embedded
    # origins remain denied, as do microphone and geolocation access.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    access_log /var/log/nginx/access.log main if=$access_loggable;

    limit_conn conn_limit 10;

    # Matches the backend's own ceiling, MAX_REQUEST_BODY_SIZE in
    # backend/app/core/config.py, which sits above its largest per-file cap
    # (50 MB) to leave room for the multipart envelope.
    client_max_body_size 60M;

    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # SEC: API documentation exposes the full schema; development only.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # RFC 9116 vulnerability-disclosure pointer, served by the backend.
    location = /.well-known/security.txt {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JSON error bodies for API clients, in FastAPI's {"detail": ...} shape so
    # the frontend's toAppError() reads them like a backend error. One named
    # location per status because `return` takes a literal code. No add_header
    # here: server-level headers are inherited only while a location adds none.
    location @api_error_502 {
        default_type application/json;
        return 502 '{"detail":"The server could not be reached. Please try again."}';
    }
    location @api_error_503 {
        default_type application/json;
        return 503 '{"detail":"The service is temporarily unavailable or the request was rate limited. Please try again shortly."}';
    }
    location @api_error_504 {
        default_type application/json;
        return 504 '{"detail":"The server took too long to respond. Please try again."}';
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_intercept_errors on;
        error_page 502 @api_error_502;
        error_page 503 @api_error_503;
        error_page 504 @api_error_504;

        # The anonymous suggestion paths (see $access_loggable above). The
        # access line is dropped at server level; the error log is raised to
        # crit here because its warn and error lines name the client and the
        # request too — a buffered screenshot upload and a rate-limit rejection
        # each log one. Everything else, the rate limit included, is inherited
        # from /api/; proxy_pass is the one directive a nested location does
        # not inherit.
        location ~ ^/api/v1/suggestions/(boxes/[^/]+/submissions$|follow-up/) {
            proxy_pass http://backend_api;
            error_log /var/log/nginx/error.log crit;
        }
    }

    location /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        error_page 502 @api_error_502;
        error_page 503 @api_error_503;
        error_page 504 @api_error_504;
    }

    location /health {
        access_log off;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        error_page 502 @api_error_502;
        error_page 503 @api_error_503;
        error_page 504 @api_error_504;
    }

    # Everything else is the SPA. The frontend container already applies the
    # caching rules for the service worker, the hashed assets and index.html,
    # so they are not repeated here.
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
