services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: intranet-mysql
    restart: unless-stopped
    # SEC: Harden container — drop all capabilities, re-add only what MySQL needs
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_DATABASE: ${DB_NAME:-intranet_db}
      MYSQL_USER: ${DB_USER:-intranet_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      TZ: ${TZ:-UTC}
    # Note: host_cache_size is set via initialization script (database/schemas/00-init-settings.sql)
    # instead of command-line flag to follow MySQL 8.0+ recommendations
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --max_allowed_packet=256M
      --innodb_buffer_pool_size=256M
      --innodb_redo_log_capacity=134217728
      --skip-name-resolve
      --skip-log-bin
      --innodb_flush_log_at_trx_commit=2
      --innodb_autoinc_lock_mode=2
      --innodb_file_per_table=1
    # SEC-14: Database port is NOT exposed to the host by default.
    # Uncomment the ports mapping below only for local development with DB tools.
    # ports:
    #   - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schemas:/docker-entrypoint-initdb.d
      - ./database/healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    networks:
      - intranet-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: intranet-redis
    restart: unless-stopped
    # SEC: Harden container — Redis needs minimal capabilities
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    # SEC: Use --requirepass for simple auth. For per-service ACL users,
    # mount infrastructure/redis/redis.conf and switch to:
    #   command: redis-server /usr/local/etc/redis/redis.conf
    # Then set REDIS_APP_PASSWORD and REDIS_CELERY_PASSWORD in .env.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env} --rename-command FLUSHALL "" --rename-command FLUSHDB "" --rename-command DEBUG ""
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    # Note: Redis may show warnings about vm.overcommit_memory and net.core.somaxconn.
    # These are informational - set at host level in production if needed.
    # sysctls require kernel namespace privileges not available in all Docker environments.
    # SEC-14: Redis port is NOT exposed to the host by default.
    # Uncomment for local development if you need direct Redis access.
    # ports:
    #   - "${REDIS_HOST_PORT:-6375}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - intranet-network

  # Backend API (Python/FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: intranet-backend
    restart: unless-stopped
    # SEC: Harden container — drop all capabilities (backend runs as non-root appuser)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # This base file is a DEVELOPMENT configuration (uvicorn --reload, source
      # bind-mount, backend port published). ENVIRONMENT defaults to development
      # but honors the .env value so it is not silently overridden. For a
      # hardened production deployment, layer the prod override on top:
      #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
      # (the override also disables --reload/docs and enforces HTTPS/TLS).
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: ${BACKEND_PORT:-3001}

      # Database - MySQL
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-intranet_db}
      DB_USER: ${DB_USER:-intranet_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}

      # Security
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?ENCRYPTION_SALT must be set in .env}
      # Audit-chain legacy boundary: pre-HMAC rows up to this ID are exempt from
      # keyed-hash verification. Must be passed through explicitly — this env
      # mapping is a whitelist, so omitting it pins upgraded installs to the
      # default 0 and every pre-upgrade audit row fails integrity checks.
      AUDIT_LOG_LEGACY_MAX_ID: ${AUDIT_LOG_LEGACY_MAX_ID:-0}

      # Frontend URL (for CORS)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

      # Public site URL that emailed links (applicant status tracker, ballots,
      # password resets, approvals) are built from. Must be passed through:
      # this environment block is a whitelist, so without this line a value
      # set in .env never reached the container and every link pointed at the
      # app's localhost default.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # Production security gates. This environment block is a whitelist with
      # no env_file, so a variable absent here cannot be set from .env at all.
      # ENVIRONMENT above IS honored from .env, so a base-only deployment can
      # put the backend into production mode — where these gates block
      # startup — while every knob that satisfies or waives them stayed
      # unreachable. That combination is unbootable AND unfixable: editing
      # .env changes nothing, because the value never reaches the container.
      # The prod override sets its own values for these and wins on merge, so
      # passing them through here only removes the silent no-op; it does not
      # loosen a hardened deployment. Defaults match app defaults so an
      # unconfigured dev stack is unchanged.
      SECURITY_ENFORCE_HTTPS: ${SECURITY_ENFORCE_HTTPS:-false}
      SECURITY_REQUIRE_TLS: ${SECURITY_REQUIRE_TLS:-true}
      SECURITY_ALLOW_UNVERIFIED_TLS: ${SECURITY_ALLOW_UNVERIFIED_TLS:-false}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_CA: ${DB_SSL_CA:-}
      REDIS_SSL: ${REDIS_SSL:-false}
      REDIS_SSL_CA: ${REDIS_SSL_CA:-}
      # Warns rather than blocks, but was unreachable for the same reason.
      VOTE_SIGNING_KEY: ${VOTE_SIGNING_KEY:-}
      # The setting the SECURITY_ENFORCE_HTTPS message directs operators to,
      # so it has to be reachable from .env or that advice is a dead end.
      # Empty means "unset" (auto-detect) via a validator on the field —
      # there is no env-var spelling for None, and Compose cannot omit a key
      # from a mapping-form environment block.
      COOKIE_SECURE: ${COOKIE_SECURE:-}

      # Same whitelist gap, non-TLS. TRUSTED_PROXY_IPS is the consequential
      # one: behind a reverse proxy, leaving it unset makes every request
      # appear to originate from the proxy's container IP, so geo-blocking
      # silently does nothing and all clients share a single rate-limit
      # bucket. An operator who set it in .env got that failure while the
      # file said otherwise. Defaults match app defaults.
      DEBUG: ${DEBUG:-false}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      # Direct printing is disabled unless the operator approves printer
      # addresses/CIDRs (for example 192.168.50.10/32).
      LABEL_PRINTER_ALLOWED_NETWORKS: ${LABEL_PRINTER_ALLOWED_NETWORKS:-}
      # Malware scanning of every uploaded file. On by default, against the
      # `clamav` service below; enabled + unreachable refuses uploads
      # (retryable 503) rather than storing them unscanned. Setting it to
      # false accepts files UNSCANNED and puts a standing warning in front of
      # administrators — see docs/FILE_STORAGE_HARDENING.md before doing so.
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}

      # ----------------------------------------------------------------
      # Every remaining backend setting, passed through from .env.
      # This block is a whitelist with no env_file (an env_file would also
      # hand the backend MYSQL_ROOT_PASSWORD and every other secret in .env),
      # and .env is not in the image, so a setting missing here silently
      # keeps its built-in default whatever .env says. Each default below
      # is the application's own, so an unconfigured stack behaves exactly
      # as the bare app does; an empty value for an optional setting reads
      # as unset. tests/test_compose_settings_passthrough.py enforces both
      # that every setting is listed and that the defaults round-trip.
      # ----------------------------------------------------------------

      # Application
      APP_NAME: ${APP_NAME:-The Logbook}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}

      # Database pool and connection retries
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_ECHO: ${DB_ECHO:-false}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-30}
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-40}
      DB_CONNECT_RETRY_DELAY: ${DB_CONNECT_RETRY_DELAY:-2}
      DB_CONNECT_RETRY_MAX_DELAY: ${DB_CONNECT_RETRY_MAX_DELAY:-15}

      # Redis
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TTL: ${REDIS_TTL:-3600}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-5}
      REDIS_CONNECT_RETRIES: ${REDIS_CONNECT_RETRIES:-3}
      REDIS_REQUIRED: ${REDIS_REQUIRED:-false}

      # Tokens and signing keys
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      AUDIT_LOG_SIGNING_KEY: ${AUDIT_LOG_SIGNING_KEY:-}
      ENCRYPTION_KEYS_LEGACY: ${ENCRYPTION_KEYS_LEGACY:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}

      # Password policy and HIPAA session/password rules
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH:-128}
      PASSWORD_REQUIRE_UPPERCASE: ${PASSWORD_REQUIRE_UPPERCASE:-true}
      PASSWORD_REQUIRE_LOWERCASE: ${PASSWORD_REQUIRE_LOWERCASE:-true}
      PASSWORD_REQUIRE_NUMBERS: ${PASSWORD_REQUIRE_NUMBERS:-true}
      PASSWORD_REQUIRE_SPECIAL: ${PASSWORD_REQUIRE_SPECIAL:-true}
      HIPAA_SESSION_TIMEOUT_MINUTES: ${HIPAA_SESSION_TIMEOUT_MINUTES:-15}
      HIPAA_PASSWORD_HISTORY_COUNT: ${HIPAA_PASSWORD_HISTORY_COUNT:-12}
      HIPAA_MINIMUM_PASSWORD_AGE_DAYS: ${HIPAA_MINIMUM_PASSWORD_AGE_DAYS:-1}
      HIPAA_MAXIMUM_PASSWORD_AGE_DAYS: ${HIPAA_MAXIMUM_PASSWORD_AGE_DAYS:-90}
      HIPAA_PASSWORD_EXPIRY_GRACE_DAYS: ${HIPAA_PASSWORD_EXPIRY_GRACE_DAYS:-14}

      # Audit retention, archive and off-host shipping
      HIPAA_AUDIT_RETENTION_DAYS: ${HIPAA_AUDIT_RETENTION_DAYS:-2555}
      AUDIT_ARCHIVE_DIR: ${AUDIT_ARCHIVE_DIR:-./audit_archives}
      AUDIT_SHIP_WEBHOOK_URL: ${AUDIT_SHIP_WEBHOOK_URL:-}
      AUDIT_SHIP_BATCH_SIZE: ${AUDIT_SHIP_BATCH_SIZE:-500}
      AUDIT_SHIP_ALLOW_PRIVATE_DESTINATION: ${AUDIT_SHIP_ALLOW_PRIVATE_DESTINATION:-false}
      AUDIT_ALLOW_CHAIN_REHASH: ${AUDIT_ALLOW_CHAIN_REHASH:-false}
      RETENTION_BLOCKED_ATTEMPTS_DAYS: ${RETENTION_BLOCKED_ATTEMPTS_DAYS:-365}
      PIPELINE_ATTENDANCE_SETTLE_DAYS: ${PIPELINE_ATTENDANCE_SETTLE_DAYS:-7}

      # Sign-in protection: lockout, suspicious-IP throttle, breached passwords
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      ACCOUNT_LOCKOUT_DURATION_MINUTES: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:-15}
      ACCOUNT_LOCKOUT_REVEAL: ${ACCOUNT_LOCKOUT_REVEAL:-false}
      SUSPICIOUS_IP_THROTTLE_ENABLED: ${SUSPICIOUS_IP_THROTTLE_ENABLED:-true}
      SUSPICIOUS_IP_MAX_FAILURES: ${SUSPICIOUS_IP_MAX_FAILURES:-50}
      SUSPICIOUS_IP_WINDOW_SECONDS: ${SUSPICIOUS_IP_WINDOW_SECONDS:-3600}
      SUSPICIOUS_IP_BLOCK_SECONDS: ${SUSPICIOUS_IP_BLOCK_SECONDS:-900}
      BREACHED_PASSWORD_CHECK_ENABLED: ${BREACHED_PASSWORD_CHECK_ENABLED:-false}
      BREACHED_PASSWORD_MIN_COUNT: ${BREACHED_PASSWORD_MIN_COUNT:-1}
      BREACHED_PASSWORD_API_URL: ${BREACHED_PASSWORD_API_URL:-https://api.pwnedpasswords.com/range}
      BREACHED_PASSWORD_TIMEOUT_SECONDS: ${BREACHED_PASSWORD_TIMEOUT_SECONDS:-3.0}

      # CAPTCHA on public forms
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-turnstile}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_TIMEOUT_SECONDS: ${CAPTCHA_TIMEOUT_SECONDS:-5.0}
      CAPTCHA_MIN_SCORE: ${CAPTCHA_MIN_SCORE:-0.5}

      # Rate limits
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-100/minute}
      PUBLIC_FORM_DAILY_LIMIT: ${PUBLIC_FORM_DAILY_LIMIT:-500}
      GUEST_CHECK_IN_DAILY_LIMIT: ${GUEST_CHECK_IN_DAILY_LIMIT:-300}

      # Startup security gates and host allowlist
      SECURITY_BLOCK_INSECURE_DEFAULTS: ${SECURITY_BLOCK_INSECURE_DEFAULTS:-false}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}

      # GeoIP and country blocking. BLOCKED_COUNTRIES uses "-" rather than
      # ":-" so that an explicitly empty value (block no countries) is
      # honoured instead of being replaced by the default list.
      GEOIP_ENABLED: ${GEOIP_ENABLED:-true}
      GEOIP_DATABASE_PATH: ${GEOIP_DATABASE_PATH:-./data/GeoLite2-Country.mmdb}
      GEOIP_FAIL_CLOSED: ${GEOIP_FAIL_CLOSED:-false}
      GEOIP_ALLOW_COUNTRY_RULE_MANAGEMENT: ${GEOIP_ALLOW_COUNTRY_RULE_MANAGEMENT:-false}
      BLOCKED_COUNTRIES: ${BLOCKED_COUNTRIES-KP,IR,SY,CU,RU,BY}
      IP_LOGGING_ENABLED: ${IP_LOGGING_ENABLED:-true}

      # File storage (paths are inside the container)
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-52428800}
      MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE:-62914560}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_CREDENTIALS_PATH: ${GCS_CREDENTIALS_PATH:-}

      # Email (SMTP, or the Cloudflare Email Service)
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Intranet Platform}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_EHLO_HOSTNAME: ${SMTP_EHLO_HOSTNAME:-}
      CLOUDFLARE_EMAIL_ENABLED: ${CLOUDFLARE_EMAIL_ENABLED:-false}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}

      # SMS (Twilio)
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}

      # Web Push
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}

      # Single sign-on (Microsoft, Google, Authentik) and Salesforce
      AZURE_AD_ENABLED: ${AZURE_AD_ENABLED:-false}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      AZURE_AD_REDIRECT_URI: ${AZURE_AD_REDIRECT_URI:-}
      AZURE_AD_ALLOWED_DOMAINS: ${AZURE_AD_ALLOWED_DOMAINS:-}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      AUTHENTIK_ENABLED: ${AUTHENTIK_ENABLED:-false}
      AUTHENTIK_ISSUER_URL: ${AUTHENTIK_ISSUER_URL:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:-}
      AUTHENTIK_ALLOWED_DOMAINS: ${AUTHENTIK_ALLOWED_DOMAINS:-}
      # Claude (MCP) member sign-in: the OAuth 2.1 authorization server. Off
      # unless enabled AND the issuer is an https:// origin.
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      MCP_OAUTH_ISSUER_URL: ${MCP_OAUTH_ISSUER_URL:-}
      OAUTH_SUCCESS_REDIRECT: ${OAUTH_SUCCESS_REDIRECT:-/auth/callback}
      OAUTH_FAILURE_REDIRECT: ${OAUTH_FAILURE_REDIRECT:-/login}
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      SALESFORCE_OAUTH_REDIRECT_URI: ${SALESFORCE_OAUTH_REDIRECT_URI:-}

      # Vulnerability disclosure (/.well-known/security.txt)
      SECURITY_TXT_CONTACT: ${SECURITY_TXT_CONTACT:-}
      SECURITY_TXT_POLICY_URL: ${SECURITY_TXT_POLICY_URL:-https://github.com/thegspiro/the-logbook/blob/main/SECURITY.md}

      # Error tracking
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      # Private CA material for DB_SSL_CA / REDIS_SSL_CA. Those settings are
      # read inside the container, so a host path from .env resolves to
      # nothing there and ssl.create_default_context raises FileNotFoundError
      # at startup — a TLS misconfiguration that presents as a boot crash.
      # Drop the PEM in ./infrastructure/certs and point the setting at the
      # container path, e.g. DB_SSL_CA=/etc/ssl/logbook/mysql-ca.pem.
      - ${SSL_CERTS_DIR:-./infrastructure/certs}:/etc/ssl/logbook:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import requests; r = requests.get(''http://localhost:3001/health'', timeout=5); exit(0 if r.status_code in (200, 503) else 1)"',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 3600s
    networks:
      - intranet-network
    # Exec form so uvicorn receives SIGTERM for graceful shutdown
    command:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "3001", "--reload"]
    init: true
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # Frontend Application
  frontend:
    build:
      # Root context: the workspace lockfile lives at the repo root and
      # `npm ci` needs it inside the context. See frontend/Dockerfile.
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        VITE_API_URL: /api/v1
    container_name: intranet-frontend
    restart: unless-stopped
    # SEC: Harden container — nginx only needs NET_BIND_SERVICE for port 80
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - intranet-network

  # Nginx Reverse Proxy (Optional - for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: intranet-nginx
    restart: unless-stopped
    # SEC: Harden container — nginx needs NET_BIND_SERVICE for ports 80/443
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    # docker.conf is this container's own config; infrastructure/nginx/nginx.conf
    # is for a host-installed nginx and cannot run here (its upstreams are
    # 127.0.0.1). TLS terminates in this container: put fullchain.pem and
    # privkey.pem in ./infrastructure/nginx/ssl before starting — nginx will
    # not start without them. See "Docker Compose production profile" in
    # docs/DEPLOYMENT.md.
    volumes:
      - ./infrastructure/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - ./infrastructure/nginx/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - intranet-network
    profiles:
      - production

  # Elasticsearch (Optional - for advanced search)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: intranet-elasticsearch
    restart: unless-stopped
    # SEC: Harden container
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=true
      # SEC: Require explicit ELASTIC_PASSWORD in .env when using with-search profile
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
    # SEC: Elasticsearch port NOT exposed to host by default.
    # Uncomment for local development with direct ES access.
    # ports:
    #   - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - intranet-network
    profiles:
      - with-search

  # MinIO (S3-compatible storage for local development)
  minio:
    image: minio/minio:latest
    container_name: intranet-minio
    restart: unless-stopped
    # SEC: Harden container
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    command: server /data --console-address ":9001"
    environment:
      # SEC: Require explicit credentials in .env when using with-s3 profile
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    # SEC: Ports are NOT exposed to the host by default.
    # Uncomment for local development if you need direct MinIO access.
    # ports:
    #   - "${MINIO_PORT:-9000}:9000"
    #   - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - intranet-network
    profiles:
      - with-s3

  # ClamAV (Optional - malware scanning of uploaded certificates)
  # Required: every upload is scanned here before it is stored. Started by a
  # plain `docker compose up -d`. The backend does not depend_on it, so the
  # application comes up while clamd is still loading; until clamd reports
  # healthy, uploads are refused with a retryable 503. First start downloads
  # signatures and can take a few minutes; clamd holds them in memory, so
  # budget roughly 1.5-3 GB of RAM.
  clamav:
    # The Debian-based build of the official image: the same release from the
    # same upstream (Cisco-Talos/clamav-docker), but published for amd64,
    # arm64 and ppc64le where clamav/clamav is amd64-only — so a Raspberry Pi
    # or Graviton host pulls it too. Its entrypoint re-owns /var/lib/clamav on
    # every start, so a volume first written by the Alpine image still works.
    image: clamav/clamav-debian:1.4.3
    container_name: intranet-clamav
    restart: unless-stopped
    # SEC: Harden container. The image's init starts as root, prepares its
    # run/database directories and drops to its own clamav user for clamd and
    # freshclam, which is what these capabilities cover.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    # SEC: clamd's port is NOT exposed to the host — it accepts any stream
    # from anyone who can reach it. The backend reaches it on the internal
    # network as clamav:3310.
    volumes:
      # Signature database, kept across restarts so freshclam does not
      # re-download it every time the container is recreated.
      - clamav_data:/var/lib/clamav
    healthcheck:
      # Ships with the image: sends PING to clamd and expects PONG.
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    environment:
      # clamd refuses a stream longer than StreamMaxLength (25M by default)
      # and the backend treats that as "no verdict", refusing the upload. The
      # largest accepted upload is 50 MB and the request body cap is 60 MB.
      CLAMD_CONF_StreamMaxLength: 60M
    networks:
      - intranet-network

  # Mailhog (Email testing in development)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: intranet-mailhog
    restart: unless-stopped
    # SEC: Bind to localhost only — Mailhog has no authentication and may
    # display password reset tokens, PII, etc. in captured emails.
    ports:
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - intranet-network
    profiles:
      - development

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  minio_data:
    driver: local
  clamav_data:
    driver: local
  uploads:
    driver: local

networks:
  intranet-network:
    driver: bridge
