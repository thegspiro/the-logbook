# Main nginx configuration for the combined image (docker/combined/Dockerfile).
#
# The server block is not here: it is frontend/nginx.conf, taken out of the
# frontend image at build time with only its listen port and upstream address
# rewritten, so the combined image serves exactly the routes, headers and
# limits the separate frontend container does.
#
# What this file adds is what running nginx as a non-root user needs. Debian's
# packaged nginx.conf assumes a root master (a `user` directive, a pid file in
# /run, temp directories under /var/lib/nginx), and every one of those paths is
# unwritable by appuser.

worker_processes 2;
pid /tmp/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The site configuration logs with format `main`, which nginx:alpine's
    # own nginx.conf defines and Debian's does not. Same definition.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    include /etc/nginx/conf.d/*.conf;
}
