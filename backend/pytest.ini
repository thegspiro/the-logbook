[pytest]
# Pytest configuration for The Logbook backend tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 8.0

# Add backend directory to Python path
pythonpath = .

# Show extra test summary info
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --timeout=30

# Test output options
console_output_style = progress

# Asyncio configuration
# Fixtures AND tests must share the session-scoped event loop: the DB engine,
# its pooled aiomysql connections, and the per-test db_session are all created
# in fixtures on the session loop, and loop-bound connections used from a
# different (per-test) loop fail chaotically (RuntimeError: Task pending /
# NotImplementedError / "attached to a different loop"). The test-loop-scope
# option requires pytest-asyncio >= 0.26 (pinned in requirements.txt).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Markers for categorizing tests
markers =
    asyncio: mark test as async
    integration: mark test as integration test
    unit: mark test as unit test
    slow: mark test as slow running
    onboarding: mark test as onboarding-related
    docker: mark test as requiring Docker daemon

# Coverage options (if using pytest-cov)
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
