[pytest]
# Pytest configuration for The Logbook backend tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 8.0

# Add backend directory to Python path
pythonpath = .

# Show extra test summary info
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --timeout=30

# Test output options
console_output_style = progress

# Asyncio configuration
# Fixtures AND tests must share the session-scoped event loop: the DB engine,
# its pooled aiomysql connections, and the per-test db_session are all created
# in fixtures on the session loop, and loop-bound connections used from a
# different (per-test) loop fail chaotically (RuntimeError: Task pending /
# NotImplementedError / "attached to a different loop"). The test-loop-scope
# option requires pytest-asyncio >= 0.26 (pinned in requirements.txt).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Warning filters
#
# A SQLAlchemy deprecation is a scheduled breakage, not advice: the ones that
# say "will raise InvalidRequestError in a future release" become hard errors
# on a version bump, and the bump is usually a one-line Dependabot PR nobody
# reads a warnings summary for. Escalating the category is what turns that into
# a red build on the commit that introduces it, while it is still cheap.
#
# The default filter is not enough, and the gap was real rather than
# theoretical: `call_tracking_service` called `.like()` on a JSON column for
# months, SQLAlchemy warned on every run, and it showed up as two lines in a
# summary at the end of a 15,000-test log. It was found by escalating this
# category, not by reading the output.
#
# `SADeprecationWarning` is the base of `Base20DeprecationWarning`,
# `LegacyAPIWarning` and `MovedIn20Warning`, so that one entry covers those
# too.
#
# `SAWarning` is a weaker claim than the other two and is escalated on a
# different argument, so do not read the three lines below as one rule. A
# deprecation is a *scheduled* breakage -- the warning is a promise of a future
# hard error, so escalating it only moves the pain earlier, and there is no
# judgement left to exercise. `SAWarning` (a RuntimeWarning) instead says "this
# may be wrong now": a cartesian product in a SELECT, a relationship that will
# copy a column into a conflicting one, an implicit coercion of a type
# SQLAlchemy does not recognise. In a multi-tenant compliance app those are
# worth a red build -- a cartesian product is how a query quietly starts
# answering with the wrong row count -- but unlike a deprecation it can fire on
# a construct that is merely unusual, or newly fire because a version bump
# changed a heuristic. When that happens the failure is a judgement call rather
# than an obligation, and the honest resolution may be to narrow this list
# again rather than to contort the call site.
#
# Escalated after measuring, not on the assumption that it was free: a full
# clean run with both categories forced to `always` (which defeats Python's
# per-location deduplication, and is why the number means anything -- the
# default filter is what hid the deprecation above for months) reported 0
# occurrences of each across 15,616 tests.
#
# When one of these fires, fix the call site. Per CLAUDE.md, adding an `ignore`
# entry here is not a fix. A test that deliberately exercises a warned path --
# `test_json_array_contains.py` pins the behavior its helper replaces -- scopes
# its own filter with `warnings.catch_warnings()` plus `simplefilter("always")`
# rather than relaxing this one for everybody.
filterwarnings =
    error::sqlalchemy.exc.SADeprecationWarning
    error::sqlalchemy.exc.SAWarning
    error::sqlalchemy.exc.SAPendingDeprecationWarning

# Markers for categorizing tests
markers =
    asyncio: mark test as async
    integration: mark test as integration test
    unit: mark test as unit test
    slow: mark test as slow running
    onboarding: mark test as onboarding-related
    docker: mark test as requiring Docker daemon

# Coverage options (if using pytest-cov)
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
