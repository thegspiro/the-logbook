# Included by every location in default.conf. nginx drops a server's
# add_header lines in any location that sets its own, so the headers live here
# and each location includes them rather than relying on inheritance.
#
# This is a template: build.sh runs csp.py, which replaces the placeholder in
# script-src with the hashes of the theme's inline scripts.
#
# Pages make no third-party request except the YouTube player, loaded in a
# frame from the privacy-enhanced domain, and badge images. Material's theme
# sets styles inline, hence 'unsafe-inline' for styles only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __INLINE_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-src https://www.youtube-nocookie.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
