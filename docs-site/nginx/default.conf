# nginx site for the documentation image. Listens on 8080 as a non-root user;
# TLS is terminated in front of it (Cloudflare Tunnel or another proxy).
server {
    # IPv4 only: a [::] listener stops nginx from starting on a Docker host
    # with IPv6 disabled, which is Unraid's default. The published port and the
    # tunnel reach the container over IPv4 either way.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects (/wiki -> /wiki/) must keep the address the visitor used.
    # An absolute redirect would name this container's host and port 8080,
    # which do not exist on the other side of the tunnel.
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The theme's bundles carry a content hash in their file names, so a new
    # build never reuses a cached one. Nothing else may be cached this way.
    location ~ "^/assets/(javascripts|stylesheets)/[^/]+\.[0-9a-f]{8}\.min\.(js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # Pages, images and the search index change with every docs update.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
