# ============================================
# THE LOGBOOK - UNRAID DOCKER COMPOSE
# ============================================
# Optimized docker-compose configuration for Unraid
#
# This file provides a complete stack including database and Redis
# Use this if you want a self-contained installation without
# using Unraid's MySQL or Redis containers
#
# Installation:
#   1. Copy this file to: /mnt/user/appdata/the-logbook/docker-compose.yml
#   2. Copy .env.example to .env and configure
#   3. Run: docker-compose up -d
#
# Ports (conflict-free defaults):
#   - Frontend: 7880
#   - Backend API: 7881
#   - Database: 3306 (internal only)
#   - Redis: 6379 (internal only)
# ============================================

services:
  # ============================================
  # Database - MySQL 8.0
  # ============================================
  db:
    image: mysql:8.0
    container_name: logbook-db
    restart: on-failure
    stop_grace_period: 10s
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_strong_password}
      MYSQL_DATABASE: ${DB_NAME:-the_logbook}
      MYSQL_USER: ${DB_USER:-logbook_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_strong_password}
      TZ: ${TZ:-America/New_York}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --max_allowed_packet=256M
      --innodb_buffer_pool_size=512M
      --innodb_redo_log_capacity=134217728
      --skip-name-resolve
      --skip-log-bin
      --innodb_flush_log_at_trx_commit=2
    volumes:
      - /mnt/user/appdata/the-logbook/mysql:/var/lib/mysql
    # Internal port only - not exposed to host to avoid conflicts
    expose:
      - "3306"
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD:-change_me_strong_password} &&
          mysql -uroot -p$${MYSQL_ROOT_PASSWORD:-change_me_strong_password} -e 'SELECT 1' $${MYSQL_DATABASE:-the_logbook}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - logbook-internal
    labels:
      - "com.unraid.docker.icon=https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mysql-icon.png"

  # ============================================
  # Cache - Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: logbook-redis
    restart: on-failure
    stop_grace_period: 10s
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me_strong_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_strong_password}
      TZ: ${TZ:-America/New_York}
    volumes:
      - /mnt/user/appdata/the-logbook/redis:/data
    # Internal port only - not exposed to host (more secure)
    # Uncomment the next 2 lines if you need external Redis access
    # ports:
    #   - "${REDIS_PORT:-6375}:6379"
    expose:
      - "6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a $${REDIS_PASSWORD:-change_me_strong_password} --no-auth-warning ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - logbook-internal
    labels:
      - "com.unraid.docker.icon=https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/redis-icon.png"

  # ============================================
  # Backend API - FastAPI
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: the-logbook-backend:local
    container_name: logbook-backend
    restart: on-failure
    environment:
      # Application
      APP_NAME: ${APP_NAME:-The Logbook}
      VERSION: ${VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORT: 3001
      DEBUG: ${DEBUG:-false}
      TZ: ${TZ:-America/New_York}

      # Database (connects to db container)
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-the_logbook}
      DB_USER: ${DB_USER:-logbook_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_strong_password}

      # Redis (connects to redis container)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_strong_password}

      # Security - REQUIRED: Generate unique keys!
      SECRET_KEY: ${SECRET_KEY:-GENERATE_WITH_openssl_rand_hex_32}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-GENERATE_WITH_openssl_rand_hex_32}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:-GENERATE_WITH_openssl_rand_hex_16}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      # Audit-chain legacy boundary: pre-HMAC rows up to this ID are exempt from
      # keyed-hash verification. Must be passed through explicitly — this env
      # mapping is a whitelist, so omitting it pins upgraded installs to the
      # default 0 and every pre-upgrade audit row fails integrity checks.
      AUDIT_LOG_LEGACY_MAX_ID: ${AUDIT_LOG_LEGACY_MAX_ID:-0}

      # CORS - Update with your Unraid IP
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://192.168.1.10:7880,http://unraid.local:7880}

      # Public site URL that emailed links (applicant status tracker, ballots,
      # password resets, approvals) are built from. Must be passed through:
      # this environment block is a whitelist, so without this line a value
      # set in .env never reached the container and every link pointed at the
      # app's localhost default.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # Host-header allowlist (rejects spoofed Host with 400). Leave empty to
      # derive it from ALLOWED_ORIGINS' hostnames + localhost; set explicitly if
      # you reach the app on a different hostname.
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
      # This compose PUBLISHES the backend port directly (no bundled reverse
      # proxy), so the connecting peer IS the real client — leave TRUSTED_PROXY_IPS
      # EMPTY. Only set it (to the proxy's IP/CIDR) if you front the app with a
      # reverse proxy such as SWAG / Nginx Proxy Manager; otherwise clients could
      # spoof X-Forwarded-For to bypass geo-blocking / rate limiting.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      # ENVIRONMENT defaults to production (below), and in production the app
      # REFUSES to start unless HTTPS is enforced. On a trusted LAN over plain
      # HTTP you must front the app with an HTTPS reverse proxy and set this true;
      # see the Unraid installation guide's security section.
      SECURITY_ENFORCE_HTTPS: ${SECURITY_ENFORCE_HTTPS:-false}
      # Secure flag on auth cookies. This env block is a whitelist, so the
      # documented LAN-trial override (COOKIE_SECURE=false in .env) must be
      # passed through here or it silently does nothing — browsers then drop
      # the Secure cookies over plain http:// and every login fails. The
      # backend's own default is auto-detect (unset), which in this stack's
      # production posture resolves to Secure=true — mirrored here because an
      # empty value is not a valid boolean for the backend.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Transport TLS to data services. The bundled db/redis containers speak
      # PLAINTEXT on the compose-internal network and do not terminate TLS.
      # The backend defaults SECURITY_REQUIRE_TLS to true in production and
      # REFUSES TO START without DB_SSL/REDIS_SSL — this explicit false keeps
      # the bundled Unraid stack bootable as an accepted risk (traffic never
      # leaves the internal Docker network). If you point the app at external
      # TLS-terminating MySQL/Redis, set DB_SSL/REDIS_SSL (+ CA certs) and
      # flip this to true to keep them configured.
      SECURITY_REQUIRE_TLS: ${SECURITY_REQUIRE_TLS:-false}
      DB_SSL: ${DB_SSL:-false}
      REDIS_SSL: ${REDIS_SSL:-false}

      # File Storage
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 52428800

      # Email (Optional)
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@example.com}

      # Malware scanning of every uploaded file. On by default, against the
      # `clamav` service below; enabled + unreachable refuses uploads
      # (retryable 503) rather than storing them unscanned. Setting it to
      # false accepts files UNSCANNED and puts a standing warning in front of
      # administrators.
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}

      # ----------------------------------------------------------------
      # Every remaining backend setting, passed through from .env.
      # This block is a whitelist with no env_file (an env_file would also
      # hand the backend MYSQL_ROOT_PASSWORD and every other secret in .env),
      # and .env is not in the image, so a setting missing here silently
      # keeps its built-in default whatever .env says. Each default below
      # is the application's own, so an unconfigured stack behaves exactly
      # as the bare app does; an empty value for an optional setting reads
      # as unset. tests/test_compose_settings_passthrough.py enforces both
      # that every setting is listed and that the defaults round-trip.
      # ----------------------------------------------------------------

      # Application
      LOG_FORMAT: ${LOG_FORMAT:-text}

      # Database pool and connection retries
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_ECHO: ${DB_ECHO:-false}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-30}
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-40}
      DB_CONNECT_RETRY_DELAY: ${DB_CONNECT_RETRY_DELAY:-2}
      DB_CONNECT_RETRY_MAX_DELAY: ${DB_CONNECT_RETRY_MAX_DELAY:-15}

      # Redis
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TTL: ${REDIS_TTL:-3600}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-5}
      REDIS_CONNECT_RETRIES: ${REDIS_CONNECT_RETRIES:-3}
      REDIS_REQUIRED: ${REDIS_REQUIRED:-false}

      # Tokens and signing keys
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      AUDIT_LOG_SIGNING_KEY: ${AUDIT_LOG_SIGNING_KEY:-}
      ENCRYPTION_KEYS_LEGACY: ${ENCRYPTION_KEYS_LEGACY:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}

      # Password policy and HIPAA session/password rules
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH:-128}
      PASSWORD_REQUIRE_UPPERCASE: ${PASSWORD_REQUIRE_UPPERCASE:-true}
      PASSWORD_REQUIRE_LOWERCASE: ${PASSWORD_REQUIRE_LOWERCASE:-true}
      PASSWORD_REQUIRE_NUMBERS: ${PASSWORD_REQUIRE_NUMBERS:-true}
      PASSWORD_REQUIRE_SPECIAL: ${PASSWORD_REQUIRE_SPECIAL:-true}
      HIPAA_SESSION_TIMEOUT_MINUTES: ${HIPAA_SESSION_TIMEOUT_MINUTES:-15}
      HIPAA_PASSWORD_HISTORY_COUNT: ${HIPAA_PASSWORD_HISTORY_COUNT:-12}
      HIPAA_MINIMUM_PASSWORD_AGE_DAYS: ${HIPAA_MINIMUM_PASSWORD_AGE_DAYS:-1}
      HIPAA_MAXIMUM_PASSWORD_AGE_DAYS: ${HIPAA_MAXIMUM_PASSWORD_AGE_DAYS:-90}
      HIPAA_PASSWORD_EXPIRY_GRACE_DAYS: ${HIPAA_PASSWORD_EXPIRY_GRACE_DAYS:-14}

      # Audit retention, archive and off-host shipping
      HIPAA_AUDIT_RETENTION_DAYS: ${HIPAA_AUDIT_RETENTION_DAYS:-2555}
      AUDIT_ARCHIVE_DIR: ${AUDIT_ARCHIVE_DIR:-./audit_archives}
      AUDIT_SHIP_WEBHOOK_URL: ${AUDIT_SHIP_WEBHOOK_URL:-}
      AUDIT_SHIP_BATCH_SIZE: ${AUDIT_SHIP_BATCH_SIZE:-500}
      AUDIT_SHIP_ALLOW_PRIVATE_DESTINATION: ${AUDIT_SHIP_ALLOW_PRIVATE_DESTINATION:-false}
      AUDIT_ALLOW_CHAIN_REHASH: ${AUDIT_ALLOW_CHAIN_REHASH:-false}
      RETENTION_BLOCKED_ATTEMPTS_DAYS: ${RETENTION_BLOCKED_ATTEMPTS_DAYS:-365}
      PIPELINE_ATTENDANCE_SETTLE_DAYS: ${PIPELINE_ATTENDANCE_SETTLE_DAYS:-7}

      # Sign-in protection: lockout, suspicious-IP throttle, breached passwords
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      ACCOUNT_LOCKOUT_DURATION_MINUTES: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:-15}
      ACCOUNT_LOCKOUT_REVEAL: ${ACCOUNT_LOCKOUT_REVEAL:-false}
      SUSPICIOUS_IP_THROTTLE_ENABLED: ${SUSPICIOUS_IP_THROTTLE_ENABLED:-true}
      SUSPICIOUS_IP_MAX_FAILURES: ${SUSPICIOUS_IP_MAX_FAILURES:-50}
      SUSPICIOUS_IP_WINDOW_SECONDS: ${SUSPICIOUS_IP_WINDOW_SECONDS:-3600}
      SUSPICIOUS_IP_BLOCK_SECONDS: ${SUSPICIOUS_IP_BLOCK_SECONDS:-900}
      BREACHED_PASSWORD_CHECK_ENABLED: ${BREACHED_PASSWORD_CHECK_ENABLED:-false}
      BREACHED_PASSWORD_MIN_COUNT: ${BREACHED_PASSWORD_MIN_COUNT:-1}
      BREACHED_PASSWORD_API_URL: ${BREACHED_PASSWORD_API_URL:-https://api.pwnedpasswords.com/range}
      BREACHED_PASSWORD_TIMEOUT_SECONDS: ${BREACHED_PASSWORD_TIMEOUT_SECONDS:-3.0}

      # CAPTCHA on public forms
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-turnstile}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_TIMEOUT_SECONDS: ${CAPTCHA_TIMEOUT_SECONDS:-5.0}
      CAPTCHA_MIN_SCORE: ${CAPTCHA_MIN_SCORE:-0.5}

      # Rate limits
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-100/minute}
      PUBLIC_FORM_DAILY_LIMIT: ${PUBLIC_FORM_DAILY_LIMIT:-500}
      GUEST_CHECK_IN_DAILY_LIMIT: ${GUEST_CHECK_IN_DAILY_LIMIT:-300}

      # Refuse to start on a critical warning in any environment
      SECURITY_BLOCK_INSECURE_DEFAULTS: ${SECURITY_BLOCK_INSECURE_DEFAULTS:-false}

      # GeoIP and country blocking. BLOCKED_COUNTRIES uses "-" rather than
      # ":-" so that an explicitly empty value (block no countries) is
      # honoured instead of being replaced by the default list.
      GEOIP_ENABLED: ${GEOIP_ENABLED:-true}
      GEOIP_DATABASE_PATH: ${GEOIP_DATABASE_PATH:-./data/GeoLite2-Country.mmdb}
      GEOIP_FAIL_CLOSED: ${GEOIP_FAIL_CLOSED:-false}
      GEOIP_ALLOW_COUNTRY_RULE_MANAGEMENT: ${GEOIP_ALLOW_COUNTRY_RULE_MANAGEMENT:-false}
      BLOCKED_COUNTRIES: ${BLOCKED_COUNTRIES-KP,IR,SY,CU,RU,BY}
      IP_LOGGING_ENABLED: ${IP_LOGGING_ENABLED:-true}

      # File storage (paths are inside the container)
      MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE:-62914560}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_CREDENTIALS_PATH: ${GCS_CREDENTIALS_PATH:-}

      # Email (SMTP, or the Cloudflare Email Service)
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Intranet Platform}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_EHLO_HOSTNAME: ${SMTP_EHLO_HOSTNAME:-}
      CLOUDFLARE_EMAIL_ENABLED: ${CLOUDFLARE_EMAIL_ENABLED:-false}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}

      # SMS (Twilio)
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}

      # Web Push
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}

      # Single sign-on (Microsoft, Google, Authentik) and Salesforce
      AZURE_AD_ENABLED: ${AZURE_AD_ENABLED:-false}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      AZURE_AD_REDIRECT_URI: ${AZURE_AD_REDIRECT_URI:-}
      AZURE_AD_ALLOWED_DOMAINS: ${AZURE_AD_ALLOWED_DOMAINS:-}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      AUTHENTIK_ENABLED: ${AUTHENTIK_ENABLED:-false}
      AUTHENTIK_ISSUER_URL: ${AUTHENTIK_ISSUER_URL:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:-}
      AUTHENTIK_ALLOWED_DOMAINS: ${AUTHENTIK_ALLOWED_DOMAINS:-}
      # Claude (MCP) member sign-in: the OAuth 2.1 authorization server. Off
      # unless enabled AND the issuer is an https:// origin.
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      MCP_OAUTH_ISSUER_URL: ${MCP_OAUTH_ISSUER_URL:-}
      OAUTH_SUCCESS_REDIRECT: ${OAUTH_SUCCESS_REDIRECT:-/auth/callback}
      OAUTH_FAILURE_REDIRECT: ${OAUTH_FAILURE_REDIRECT:-/login}
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      SALESFORCE_OAUTH_REDIRECT_URI: ${SALESFORCE_OAUTH_REDIRECT_URI:-}

      # CA certificates for DB_SSL / REDIS_SSL (paths inside the container),
      # and the break-glass for TLS whose certificate is not verified
      DB_SSL_CA: ${DB_SSL_CA:-}
      REDIS_SSL_CA: ${REDIS_SSL_CA:-}
      SECURITY_ALLOW_UNVERIFIED_TLS: ${SECURITY_ALLOW_UNVERIFIED_TLS:-false}

      # Dedicated vote-signature key (falls back to SECRET_KEY when empty)
      VOTE_SIGNING_KEY: ${VOTE_SIGNING_KEY:-}

      # Direct label printing stays off until printer IPs/CIDRs are approved
      LABEL_PRINTER_ALLOWED_NETWORKS: ${LABEL_PRINTER_ALLOWED_NETWORKS:-}

      # Vulnerability disclosure (/.well-known/security.txt)
      SECURITY_TXT_CONTACT: ${SECURITY_TXT_CONTACT:-}
      SECURITY_TXT_POLICY_URL: ${SECURITY_TXT_POLICY_URL:-https://github.com/thegspiro/the-logbook/blob/main/SECURITY.md}

      # Error tracking
      SENTRY_DSN: ${SENTRY_DSN:-}

      # Modules are enabled per organization at runtime via the organization's
      # settings (enabled_modules) — there are no MODULE_*_ENABLED deployment
      # flags (they gated nothing; all API routers register unconditionally).

      # Monitoring
      # API docs (/docs, /redoc, /openapi.json) OFF by default — in production
      # the security gate blocks startup if they are enabled (they expose the
      # full API surface for enumeration). Only enable on a trusted network.
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}

      # Backups are handled by the `backup` sidecar service below, not by
      # the backend process — see that service for schedule/retention knobs.

      # Unraid User/Group IDs
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}

    # SECURITY: published in PLAINTEXT on every host interface by default —
    # the documented reverse-proxy flow (SWAG / Nginx Proxy Manager) forwards
    # /api to this host port, so it cannot default to loopback without
    # breaking that flow. Once HTTPS is set up, restrict it: set
    # BIND_ADDRESS=127.0.0.1 in .env if the proxy runs on this host (or joins
    # the logbook-internal network), or to a specific host IP.
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-7881}:3001"

    volumes:
      - /mnt/user/appdata/the-logbook/data:/app/data
      - /mnt/user/appdata/the-logbook/uploads:/app/uploads
      - /mnt/user/appdata/the-logbook/logs:/app/logs
      - /mnt/user/backups/the-logbook:/backups

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # init: true ensures signals are forwarded even if CMD form changes
    init: true
    stop_grace_period: 15s

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:3001/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - logbook-internal

    labels:
      - "com.unraid.docker.managed=true"
      - "com.unraid.docker.icon=https://raw.githubusercontent.com/thegspiro/the-logbook/main/unraid/icon.png"
      - "com.unraid.docker.webui=http://[IP]:[PORT:7880]"

  # ============================================
  # Frontend - React/Vite
  # ============================================
  frontend:
    build:
      # Root context: the workspace lockfile lives at the repo root and
      # `npm ci` needs it inside the context. See frontend/Dockerfile.
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        # Use relative URL since nginx proxies /api to backend
        VITE_API_URL: /api/v1
    image: the-logbook-frontend:local
    container_name: logbook-frontend
    restart: on-failure
    stop_grace_period: 10s
    environment:
      TZ: ${TZ:-America/New_York}

      # Unraid User/Group IDs
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}

    # SECURITY: this serves the FULL APP in PLAINTEXT on every host interface
    # by default, and stays reachable even after HTTPS is set up. The default
    # cannot be loopback because the documented reverse-proxy flow (SWAG /
    # Nginx Proxy Manager) forwards to this host port. Once your HTTPS proxy
    # works, set BIND_ADDRESS=127.0.0.1 in .env (proxy on this host / on the
    # logbook-internal network) or a specific host IP, so LAN clients cannot
    # bypass HTTPS.
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-7880}:80"

    depends_on:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:80/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - logbook-internal

    labels:
      - "com.unraid.docker.managed=true"
      - "com.unraid.docker.icon=https://raw.githubusercontent.com/thegspiro/the-logbook/main/unraid/icon.png"
      - "com.unraid.docker.webui=http://[IP]:[PORT:7880]"

  # ============================================
  # Backup Sidecar
  # ============================================
  # Nightly mysqldump + uploads archive written to /mnt/user/backups/the-logbook,
  # pruned after BACKUP_RETENTION_DAYS, with an automated restore-verification
  # drill every VERIFY_EVERY_N_BACKUPS runs (scripts/backup-sidecar.sh — same
  # sidecar the production compose uses). Archives are LOCAL to this host:
  # sync the backups share offsite, and keep ENCRYPTION_KEY/ENCRYPTION_SALT
  # stored separately — a backup without its era's keys cannot decrypt
  # encrypted fields. See docs/BACKUP.md.
  backup:
    image: mysql:8.0
    container_name: logbook-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/scripts/backup-sidecar.sh"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-the_logbook}
      DB_USER: ${DB_USER:-logbook_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_strong_password}
      # Restore drills load the dump into a throwaway schema, which needs
      # CREATE/DROP DATABASE — hence root, scoped to this internal network.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_strong_password}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      VERIFY_EVERY_N_BACKUPS: ${VERIFY_EVERY_N_BACKUPS:-7}
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./scripts:/scripts:ro
      - /mnt/user/backups/the-logbook:/backups
      - /mnt/user/appdata/the-logbook/uploads:/uploads:ro
    networks:
      - logbook-internal

  # ============================================
  # ClamAV - malware scanning (required)
  # ============================================
  # Every upload is scanned here before it is stored. Loads its signature
  # database into memory — budget roughly 1.5-3 GB of RAM — and takes a few
  # minutes to become healthy on first start; uploads are refused with a
  # retryable error until it is. Its port stays on the internal network.
  clamav:
    # The Debian-based build of the official image: the same release from the
    # same upstream (Cisco-Talos/clamav-docker), but published for amd64,
    # arm64 and ppc64le where clamav/clamav is amd64-only — so a Raspberry Pi
    # or Graviton host pulls it too. Its entrypoint re-owns /var/lib/clamav on
    # every start, so a volume first written by the Alpine image still works.
    image: clamav/clamav-debian:1.4.3
    container_name: logbook-clamav
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    volumes:
      # Docker-managed rather than an appdata path: the image's own clamav
      # user must own it, which a share with nobody:users ownership is not.
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    environment:
      # clamd refuses a stream longer than StreamMaxLength (25M by default),
      # which the backend treats as "no verdict" and refuses the upload. The
      # largest accepted upload is 50 MB and the request body cap is 60 MB.
      CLAMD_CONF_StreamMaxLength: 60M
    networks:
      - logbook-internal

# ============================================
# Networks
# ============================================
networks:
  logbook-internal:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  # ClamAV signature database.
  clamav_data:
    driver: local
  # Alternative to host paths — uncomment if you prefer Docker-managed
  # volumes for the database and cache:
#   mysql_data:
#     driver: local
#   redis_data:
#     driver: local
#   app_data:
#     driver: local
#   uploads:
#     driver: local
#   logs:
#     driver: local

# ============================================
# Usage Instructions
# ============================================
#
# 1. Copy this file to /mnt/user/appdata/the-logbook/docker-compose.yml
#
# 2. Create .env file in same directory with these REQUIRED variables:
#
#    # Generate these with: openssl rand -hex 32
#    SECRET_KEY=your_generated_secret_key_here
#    ENCRYPTION_KEY=your_generated_encryption_key_here
#
#    # Set strong passwords
#    MYSQL_ROOT_PASSWORD=strong_password_here
#    DB_PASSWORD=strong_password_here
#    REDIS_PASSWORD=strong_password_here
#
#    # Your Unraid IP
#    ALLOWED_ORIGINS=http://192.168.1.10:7880
#
# 3. Start the stack:
#    cd /mnt/user/appdata/the-logbook
#    docker-compose up -d
#
# 4. Check status:
#    docker-compose ps
#    docker-compose logs -f
#
# 5. Access application:
#    http://YOUR-UNRAID-IP:7880
#
# Management Commands (docker compose v2; use docker-compose if that's what
# your Unraid has):
#   docker compose up -d              # Start all services
#   docker compose down               # Stop all services
#   docker compose down --remove-orphans  # Stop all + clean up orphans
#   docker compose restart            # Restart all services
#   docker compose logs -f backend    # View backend logs
#   docker compose logs -f backup     # View backup sidecar logs
#   docker compose exec backend bash  # Access backend shell
#   docker compose exec db mysql -u root -p  # Access database
#
# Removal:
#   docker compose down --remove-orphans  # Remove all containers + network
#   Or run: ./unraid/unraid-setup.sh and choose option 4
#
# Backup:
#   Automated: the `backup` sidecar service runs nightly (BACKUP_TIME).
#   Manual (from the host, in the install directory): ./scripts/backup.sh
#   Restore: ./scripts/backup.sh --restore /mnt/user/backups/the-logbook/logbook_backup_TIMESTAMP.tar.gz
#
# Update:
#   ./unraid/update.sh   # verified DB dump + build-context repair + rebuild
#
# For more help, see: /mnt/user/appdata/the-logbook/docs/deployment/unraid.md
# ============================================
