# ── Department-branded installable-app assets ────────────────────────────────
# The web app manifest and index.html reference the app's icons and iOS launch
# images by fixed URL, and a browser fetches them while deciding whether the
# site can be installed — with no session, long before anyone signs in. So the
# only way a department's own crest can become the icon on a member's home
# screen is for the backend to render it into these exact geometries at request
# time.
#
# This map is the single authority for which backend asset answers which URL.
# The location below matches a wider pattern on purpose: anything this map does
# not name falls to the default, which the backend answers 404, and the 404
# path serves the shipped Logbook asset. An unmapped URL therefore behaves
# exactly as it did before any of this existed.
map $uri $branded_app_asset {
    default                    /api/public/v1/branding/icon/unmapped.png;
    /pwa-192x192.png           /api/public/v1/branding/icon/192.png;
    /pwa-512x512.png           /api/public/v1/branding/icon/512.png;
    /pwa-maskable-512x512.png  /api/public/v1/branding/icon/maskable-512.png;
    /apple-touch-icon.png      /api/public/v1/branding/icon/apple-touch.png;

    ~^/apple-splash-(\d+)-(\d+)\.png$  /api/public/v1/branding/splash/$1-$2.png;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SEC: Hide nginx version in headers and error pages
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Scanning is a first-party feature. Keep sensitive unrelated capabilities
    # disabled while allowing this origin to use the device camera.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Branded app icons and iOS launch images — see the map above. Matched by a
    # wider pattern than the map names so a URL the map does not cover still
    # reaches the fallback rather than the immutable static rule below.
    location ~ ^/(pwa-|apple-touch-icon|apple-splash-)[^/]*\.png$ {
        # Captured before the rewrite, which replaces $uri.
        set $branded_fallback $uri;
        rewrite ^ $branded_app_asset break;

        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # A department with no logo, and a backend that is down or still
        # starting, both mean the same thing here: serve what shipped.
        proxy_intercept_errors on;
        # 405 is in the list so a method the router does not answer still gets
        # the behaviour these URLs had when they were plain files on disk.
        error_page 404 405 500 502 503 504 = @branded_asset_fallback;

        # nginx appends rather than replaces, so the upstream's own copies of
        # these are hidden first — otherwise every response carries two.
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # The shipped asset, under its original name. Reached when no department
    # logo is configured, when it cannot be rendered, or when the backend is
    # unreachable. Deliberately NOT immutable: the same URL starts answering
    # with the department's crest as soon as one is uploaded.
    location @branded_asset_fallback {
        try_files $branded_fallback =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-add security headers (nginx doesn't inherit add_header directives)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # API proxy (if backend is on same server)
    # ── JSON error responses for API clients ─────────────────────────────
    # The SPA's axios and any API client parse the body as JSON; the HTML
    # 50x page below is for browser navigations only. Without these, a
    # request made while the backend is unreachable comes back as HTML and
    # surfaces as a JSON parse error instead of "the server is down".
    #
    # One named location per status because `return` takes a literal code.
    # The body uses FastAPI's {"detail": ...} shape so toAppError() reads
    # these the same way it reads a real backend error.
    location @api_error_502 {
        default_type application/json;
        return 502 '{"detail":"The server could not be reached. Please try again."}';
    }
    location @api_error_503 {
        default_type application/json;
        return 503 '{"detail":"The service is temporarily unavailable or the request was rate limited. Please try again shortly."}';
    }
    location @api_error_504 {
        default_type application/json;
        return 504 '{"detail":"The server took too long to respond. Please try again."}';
    }

    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 256k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        # Prevent caching of authenticated API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        # Re-add security headers for proxied responses
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Errors on this path are consumed by JSON clients, not by a browser.
        error_page 502 @api_error_502;
        error_page 503 @api_error_503;
        error_page 504 @api_error_504;
    }

    # SEC: Block API documentation and schema endpoints in production.
    # These expose the full API surface to unauthenticated users.
    # For development, access docs directly via the backend port (3001).
    location /docs {
        return 404;
    }
    location /redoc {
        return 404;
    }

    # Health check proxy
    location /health {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        error_page 502 @api_error_502;
        error_page 503 @api_error_503;
        error_page 504 @api_error_504;
    }

    # SEC: Block OpenAPI schema — prevents endpoint enumeration.
    location /openapi.json {
        return 404;
    }

    # Service worker scripts must never be HTTP-cached. Without these exact
    # matches they fall into the 1-year-immutable .js rule above, which pins
    # installed PWAs to a stale worker for a year.
    #
    # push-sw.js is now concatenated into sw.js at build time rather than
    # pulled in with importScripts, but it is still deployed and still needs
    # this rule: workers installed before that change keep importing it, and
    # importScripts DOES go through the HTTP cache during update checks.
    # registerSW.js is referenced from index.html without a content hash, so
    # it gets the same treatment.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'" always;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'" always;
    }
    location = /push-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'" always;
    }

    # Version manifest for cache-refresh detection — must never be cached
    # so the frontend can detect new deployments while users are active.
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent caching of index.html so browsers always get the latest
        # asset references after a deployment
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # Re-add security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Error pages — do NOT redirect 404 to index.html here; try_files in
    # location / already handles SPA routing. Redirecting 404 would cause
    # stale asset requests (e.g. old JS chunks) to receive HTML instead of
    # a proper 404, triggering JavaScript parse errors in the browser.
    error_page 502 503 504 /50x.html;

    location = /50x.html {
        # No 'internal' — allow direct GET so the service worker can precache it.
        # error_page directives still work without the internal restriction.
    }
}
