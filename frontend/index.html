<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>The Logbook - Volunteer Fire Department Intranet</title>
    <meta name="title" content="The Logbook - Volunteer Fire Department Intranet" />
    <meta name="description" content="A secure department intranet built by volunteer firefighters, for volunteer firefighters. Designed with HIPAA requirements in mind. Open source and community driven." />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="fire department, volunteer fire department, intranet, HIPAA security features, emergency services, fire department software" />
    <meta name="author" content="The Logbook Contributors" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Security Headers - Note: These are set via nginx HTTP headers, not meta tags -->
    <!-- X-Frame-Options, Content-Security-Policy, etc. are configured in nginx.conf -->

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Logbook - Volunteer Fire Department Intranet" />
    <meta property="og:description" content="A secure department intranet built by volunteer firefighters, for volunteer firefighters. Designed with HIPAA requirements in mind. Open source and community driven." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="The Logbook - Volunteer Fire Department Intranet" />
    <meta name="twitter:description" content="A secure department intranet built by volunteer firefighters, for volunteer firefighters." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#991b1b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Logbook" />

    <!-- iOS launch images. Unlike Android, iOS does not build a splash screen
         from the manifest — an installed PWA flashes blank white on every cold
         start without these. Each media query must match a device's exact CSS
         geometry and DPR; there is no scaling fallback, so an unlisted device
         simply gets the blank screen. Regenerate with `npm run generate:pwa-assets`,
         which prints these tags. -->
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/apple-splash-640-1136.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/apple-splash-750-1334.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1170-2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1179-2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1206-2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1242-2208.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/apple-splash-828-1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1284-2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1290-2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1320-2868.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/apple-splash-1536-2048.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/apple-splash-1620-2160.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/apple-splash-1640-2360.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/apple-splash-2048-2732.png" />

    <!-- Accessibility -->
    <meta name="accessibility" content="WCAG 2.1 Level AA" />

  </head>
  <body>
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="skip-to-main">Skip to main content</a>

    <!-- Main app container -->
    <div id="root"></div>

    <!-- Module script -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Noscript fallback -->
    <noscript>
      <div style="
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(to bottom right, #0f172a, #7f1d1d, #0f172a);
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 20px;
        text-align: center;
      ">
        <div style="max-width: 600px;">
          <h1 style="font-size: 2rem; margin-bottom: 1rem;">JavaScript Required</h1>
          <p style="font-size: 1.125rem; opacity: 0.9;">
            The Logbook requires JavaScript to be enabled in your browser.
            Please enable JavaScript and reload the page.
          </p>
        </div>
      </div>
    </noscript>
  </body>
</html>
