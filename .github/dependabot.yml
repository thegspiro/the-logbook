# Automated dependency updates (ISO/IEC 27001 A.8.8 — technical vulnerability
# management). Pairs with the Bandit/pip-audit/npm-audit gates in CI: the
# scanners detect, Dependabot patches.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # PyMySQL 1.2.1 replaced converters.escape_bytes_prefixed with a string
    # sentinel, and aiomysql 0.3.2 (its latest release) still calls it for every
    # bytes parameter, so any BLOB write raises TypeError. Lift this once an
    # aiomysql release supports PyMySQL >= 1.2.1 — see docs/KNOWN_LIMITATIONS.md.
    #
    # python-dateutil 3.x cannot be installed: every botocore (boto3's S3
    # backend) caps it at <3.0.0, so pip fails with ResolutionImpossible (#3752).
    # Lift this once a botocore release accepts python-dateutil 3.
    ignore:
      - dependency-name: "pymysql"
        versions: [">=1.2.1"]
      - dependency-name: "python-dateutil"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # npm workspaces: the lockfile lives at the repo root and covers frontend/
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # jsdom 30.1 changed Blob's own symbols, and vitest (4.1 and 5.0 alike)
    # finds jsdom's private Blob impl by taking the first one, so its
    # URL.createObjectURL shim throws on every jsdom Blob. Lift this once a
    # vitest release handles jsdom >= 30.1 — see docs/KNOWN_LIMITATIONS.md.
    ignore:
      - dependency-name: "jsdom"
        versions: [">=30.1.0"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
