# Supply-chain security (ISO/IEC 27001 A.8.8): dependency vulnerability
# sweep across every ecosystem lockfile, plus SBOM generation so deploying
# departments can answer "what exactly is in this release?"
#
# Scope note: scanners are limited to `vuln` — secrets are covered by the
# dedicated gitleaks workflow, and IaC misconfig scanning is deliberately
# not enabled until its findings have been triaged (a blocking scanner
# nobody has baselined just turns CI red and gets ignored).
name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly sweep (Mondays 06:30 UTC) so new advisories against unchanged
    # code still surface between PRs
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  # PR pushes share a group per ref, so a superseded push is cancelled. Runs
  # for main get a group of their own PER COMMIT, which is stronger than
  # `cancel-in-progress: false` and is what an audit record actually needs.
  #
  # `cancel-in-progress: false` alone is not enough: GitHub keeps at most one
  # running and one *pending* run per group, so when three or more main runs
  # overlap, each new arrival evicts the pending one and that commit's scan is
  # never recorded — the exact gap this is meant to close (ISO/IEC 27001
  # A.8.8: "no record" is the outcome to avoid). Keying main runs on the SHA
  # gives each commit its own group, where there is nothing to evict it from.
  group: supply-chain-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  trivy-vulns:
    name: Trivy dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Scan lockfiles for HIGH/CRITICAL vulnerabilities
        # Pinned to a commit SHA, not a tag. A tag is mutable — whoever controls
        # the action can repoint it at new code, and this workflow would run that
        # code with the repository checked out. `@v0` was the sharpest case: a
        # floating major that follows every v0.x release automatically. For
        # workflows whose whole purpose is supply-chain and secret integrity,
        # taking on a mutable third-party reference undercuts the thing being
        # checked. Dependabot's github-actions ecosystem (already configured in
        # .github/dependabot.yml) bumps these SHAs and records the new version.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          # Only fail on advisories that have a released fix — unfixable
          # findings are tracked by the weekly schedule, not blocking PRs.
          ignore-unfixed: true
          exit-code: "1"

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # sbom-action downloads syft from GitHub releases on every run, and
      # that download fails transiently (HTTP 000) often enough to have
      # turned this job red three times on 2026-08-12 alone. Actions has no
      # native step retry, so the pattern is: let the first attempt fail
      # softly, run an identical second attempt only when it did.
      # Pinned to a commit SHA rather than the floating `@v0` major tag it
      # used to carry; see the note on the Trivy step above for why.
      - name: Generate SPDX SBOM (Syft)
        id: sbom
        continue-on-error: true
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: the-logbook-sbom.spdx.json
          upload-artifact: true

      # An immediate retry rides out a dropped connection but not an outage
      # window: the first observed double failure was two 503s from the
      # releases endpoint 0.3s apart. Wait out the window before retrying.
      - name: Pause before retry
        if: steps.sbom.outcome == 'failure'
        run: sleep 60

      - name: Generate SPDX SBOM (Syft) — retry after transient failure
        if: steps.sbom.outcome == 'failure'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: the-logbook-sbom.spdx.json
          upload-artifact: true
