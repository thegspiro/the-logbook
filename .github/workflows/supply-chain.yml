# Supply-chain security (ISO/IEC 27001 A.8.8): dependency vulnerability
# sweep across every ecosystem lockfile, plus SBOM generation so deploying
# departments can answer "what exactly is in this release?"
#
# Scope note: scanners are limited to `vuln` — secrets are covered by the
# dedicated gitleaks workflow, and IaC misconfig scanning is deliberately
# not enabled until its findings have been triaged (a blocking scanner
# nobody has baselined just turns CI red and gets ignored).
name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly sweep (Mondays 06:30 UTC) so new advisories against unchanged
    # code still surface between PRs
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-vulns:
    name: Trivy dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan lockfiles for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          # Only fail on advisories that have a released fix — unfixable
          # findings are tracked by the weekly schedule, not blocking PRs.
          ignore-unfixed: true
          exit-code: "1"

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # sbom-action downloads syft from GitHub releases on every run, and
      # that download fails transiently (HTTP 000) often enough to have
      # turned this job red three times on 2026-08-12 alone. Actions has no
      # native step retry, so the pattern is: let the first attempt fail
      # softly, run an identical second attempt only when it did.
      - name: Generate SPDX SBOM (Syft)
        id: sbom
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: the-logbook-sbom.spdx.json
          upload-artifact: true

      # An immediate retry rides out a dropped connection but not an outage
      # window: the first observed double failure was two 503s from the
      # releases endpoint 0.3s apart. Wait out the window before retrying.
      - name: Pause before retry
        if: steps.sbom.outcome == 'failure'
        run: sleep 60

      - name: Generate SPDX SBOM (Syft) — retry after transient failure
        if: steps.sbom.outcome == 'failure'
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: the-logbook-sbom.spdx.json
          upload-artifact: true
