name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Backend
  # ──────────────────────────────────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install linting tools
        # Pinned to the versions in backend/requirements.txt — an unpinned
        # `black` here once resolved to a newer major whose formatting
        # disagrees with the repo-wide pinned format.
        run: pip install 'flake8==7.2.0' 'black==25.1.0' 'isort==5.13.2'

      - name: Run flake8
        run: flake8 app/

      - name: Check formatting with black
        run: black --check app/

      - name: Check import order with isort
        run: isort --check-only app/

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run Bandit (Python SAST)
        run: bandit -r app/ -c pyproject.toml -f json -o bandit-report.json || true

      - name: Show Bandit results
        if: always()
        run: bandit -r app/ -c pyproject.toml -ll

      - name: Run pip-audit (dependency vulnerabilities)
        # BLOCKING since the 2026-07-30 FastAPI/starlette upgrade pass.
        # Audits the requirements set (-r), not the runner environment, so
        # runner-image packages (pip/setuptools/wheel) don't fail the build.
        # The explicit ignores are the documented deferrals from
        # docs/KNOWN_LIMITATIONS.md: black 26 is a major that reformats the
        # repo. Remove an ignore when its entry clears. (The pyopenssl
        # ignores went away with the unused pysaml2 dependency.)
        run: |
          pip install -r requirements.txt
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-2120 \
            --ignore-vuln PYSEC-2026-2121

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json

  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (no DB required)
        run: |
          pytest tests/ \
            -m "not integration and not slow and not docker" \
            -v --tb=short

  backend-test-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: intranet_db
          MYSQL_USER: intranet_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        # start-period + generous retries: MySQL's first-boot InnoDB
        # initialization can take 30s+ on a slow runner, and a failed health
        # probe during that window previously killed the whole job before
        # checkout ("Failed to initialize container mysql:8.0").
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=40s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: intranet_db
      DB_USER: intranet_user
      DB_PASSWORD: test_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      ENVIRONMENT: testing
      SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_SECRET: ci-test-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Align database collation with production
        # Service containers can't take command-line flags, so this MySQL
        # runs the 8.0 default collation (utf8mb4_0900_ai_ci) while
        # docker-compose runs --collation-server=utf8mb4_unicode_ci.
        # Migrations create some tables with an explicit unicode_ci
        # collation, and FKs across the two collations fail (error 3780).
        run: |
          mysql --host 127.0.0.1 --port 3306 -uroot -proot \
            -e "ALTER DATABASE intranet_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Repair schema to model shape (mirrors production startup)
        # Deployments don't rely on the migration chain alone: startup runs
        # create_all(checkfirst=True) plus a missing-column repair, which is
        # how model-only tables (positions, skill_templates, ...) and
        # later-model columns materialize. Mirror that here so the test
        # database matches what production actually runs against.
        run: |
          python - <<'PYEOF'
          from sqlalchemy import create_engine
          from sqlalchemy.pool import NullPool

          from app.core.config import settings
          from main import _add_missing_model_columns, _import_all_models

          _import_all_models()
          from app.core.database import Base

          engine = create_engine(settings.SYNC_DATABASE_URL, poolclass=NullPool)
          with engine.begin() as conn:
              Base.metadata.create_all(conn, checkfirst=True)
          _add_missing_model_columns(engine)
          print("Schema repair complete")
          PYEOF

      - name: Probe async DB connectivity (aiomysql)
        # The test session's database_manager.connect() fails its first
        # attempt invisibly (loguru warnings don't reach pytest output) and
        # its 15s retry backoff then collides with the 30s per-test timeout,
        # cascading into every DB test. This step reproduces the exact async
        # connect outside pytest so the true exception lands in the job log.
        run: |
          python - <<'PYEOF'
          import asyncio, sys, traceback

          import aiomysql
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          from app.core.config import settings

          print("aiomysql", aiomysql.__version__)
          url = settings.DATABASE_URL
          pw = settings.DB_PASSWORD or ""
          print("DATABASE_URL:", url.replace(pw, "***") if pw else url)
          print("connect_args:", settings.get_db_connect_args())

          async def main():
              engine = create_async_engine(
                  settings.DATABASE_URL,
                  connect_args=settings.get_db_connect_args(),
              )
              async with engine.begin() as conn:
                  result = await conn.execute(text("SELECT 1"))
                  print("SELECT 1 ->", result.scalar())
              await engine.dispose()

          try:
              asyncio.run(asyncio.wait_for(main(), timeout=20))
              print("Async DB connectivity OK")
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          PYEOF

      - name: Run integration tests
        # docker-marked tests build production images (minutes each — far
        # past the 30s per-test timeout) and belong to a dedicated
        # docker-capable pipeline, not the MySQL/Redis service job. Their
        # 30s SIGALRM interrupts also wedge the shared session event loop,
        # cascading setup timeouts into every DB-backed test after them.
        run: |
          pytest tests/ \
            -m "integration and not docker and not slow" \
            -v --tb=short

  # ──────────────────────────────────────────────
  # Frontend
  # ──────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npm run typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage

  frontend-security:
    name: Frontend Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Blocking at high/critical. Moderate advisories that only a breaking
      # major upgrade can fix (e.g. react-router 6→7) don't fail the build;
      # track those in docs/COMPLIANCE.md instead of silencing them here.
      - name: Run npm audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
