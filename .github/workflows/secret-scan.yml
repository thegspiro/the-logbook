# Secret scanning (ISO/IEC 27001 A.8.8 / A.5.17 — leaked credentials are the
# fastest route to full compromise). Scans the full git history on a schedule
# and each push/PR diff range.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history sweep (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  # PR pushes share a group per ref, so a superseded push is cancelled. Runs
  # for main get a group of their own PER COMMIT, which is stronger than
  # `cancel-in-progress: false` and is what an audit record actually needs.
  #
  # `cancel-in-progress: false` alone is not enough: GitHub keeps at most one
  # running and one *pending* run per group, so when three or more main runs
  # overlap, each new arrival evicts the pending one and that commit's scan is
  # never recorded — the exact gap this is meant to close (ISO/IEC 27001
  # A.8.8: "no record" is the outcome to avoid). Keying main runs on the SHA
  # gives each commit its own group, where there is nothing to evict it from.
  group: secret-scan-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so leaks buried in old commits are found too
          fetch-depth: 0

      - name: Run gitleaks
        # Pinned to a commit SHA, not a tag. A tag is mutable — whoever controls
        # the action can repoint it at new code, and this workflow would run that
        # code with the repository checked out. `@v3` is a floating major that
        # follows every v3.x release automatically, and this job runs with the
        # full history fetched. For a workflow whose whole purpose is credential
        # integrity, taking on a mutable third-party reference undercuts the
        # thing being checked. Dependabot's github-actions ecosystem (configured in
        # .github/dependabot.yml) bumps these SHAs and records the new version.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
