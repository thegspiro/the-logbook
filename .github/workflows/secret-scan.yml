# Secret scanning (ISO/IEC 27001 A.8.8 / A.5.17 — leaked credentials are the
# fastest route to full compromise). Scans the full git history on a schedule
# and each push/PR diff range.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history sweep (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so leaks buried in old commits are found too
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
